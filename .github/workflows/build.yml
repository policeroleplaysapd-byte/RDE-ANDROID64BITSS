name: Build Android .so

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v3
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Build with CMake
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-26 \
                ..
              cmake --build .

      - name: Upload Artifact (.so)
        uses: actions/upload-artifact@v4
        with:
          name: rde_ai_so
          path: build/rde_ai.so
          
